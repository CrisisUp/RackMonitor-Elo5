[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
test_ignore = *
monitor_filters = send_on_enter
monitor_echo = yes


; --- Reduz a velocidade de upload para evitar erro de transferência ---
upload_speed = 115200

; --- Força -Os (substitui o -O2 do framework) ---
extra_scripts = post:force_os.py

; --- Otimização de tamanho ---
build_unflags = -O2 -O3 -Og
build_flags = -Os

lib_deps = 
    ; miguelbalboa/MFRC522@^1.4.11      <-- REMOVIDO (não é compatível com PN532)
    adafruit/Adafruit PN532@^1.3.0     ; <-- ADICIONADO (para o NFC Module V3)
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/RTClib@^2.1.4
    adafruit/DHT sensor library@^1.4.6
    knolleary/PubSubClient@^2.8
    makuna/Rtc@^2.4.2

; board_build.partitions = partitions.csv


[env:native]
platform = native
test_framework = unity

; Nome novo (test_build_project_src está deprecado)
test_build_src = false

lib_ignore =
    alarme
    alarme_ambiental
    audio
    botao
    botao_panico
    display_oled
    hmac
    ldr
    led_rgb
    leitor_rfid
    log_central
    notificador_mqtt
    nvs
    ota
    pir
    porta
    relogio
    sensor_dht
    serial_commands
    test_mode
    ultrassonico

build_flags = 
    -DUNIT_TEST
    -DNATIVE_TEST
    -std=gnu++17