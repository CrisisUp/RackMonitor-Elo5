services:
  test:
    image: rackmonitor-tools:latest  # <-- Usa a imagem pronta
    volumes:
      - .:/app
    working_dir: /app
    command: pio test -e native

  build:
    image: rackmonitor-tools:latest
    volumes:
      - .:/app
    working_dir: /app
    command: pio run -e esp32dev

  upload:
    image: rackmonitor-tools:latest
    volumes:
      - .:/app
    working_dir: /app
    command: pio run -e esp32dev -t upload
    devices:
      - "${ESP32_PORT:-/dev/ttyUSB0}:/dev/ttyUSB0"

  monitor:
    image: rackmonitor-tools:latest
    volumes:
      - .:/app
    working_dir: /app
    command: pio device monitor -e esp32dev
    devices:
      - "${ESP32_PORT:-/dev/ttyUSB0}:/dev/ttyUSB0"
    stdin_open: true
    tty: true